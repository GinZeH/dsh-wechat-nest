name: Release

on:
  push:
    tags: ['v*']
    # Allows API clients that can create branches to initiate a release.
    branches: ['release/v*']
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Validate release version
        id: version
        shell: bash
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch && "${GITHUB_REF_NAME#release/}" != "$tag" ]]; then
            echo "::error::Release ref does not match package.json"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm test
      - run: npm run pack:release
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-bundle
          path: release-assets/*
          if-no-files-found: error
      - name: Extract release notes
        uses: release-flow/keep-a-changelog-action@v3
        id: changelog
        with:
          command: query
          version: ${{ steps.version.outputs.tag }}
      - run: printf '%s\n' "$RELEASE_NOTES" > release-assets/RELEASE_NOTES.md
        env:
          RELEASE_NOTES: ${{ steps.changelog.outputs.release-notes }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-assets/RELEASE_NOTES.md

  release:
    needs: bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: desktop-bundle
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: release-assets
      - name: Refuse an existing tag on another commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.bundle.outputs.tag }}
        run: |
          if gh api "repos/$REPO/git/ref/tags/$TAG" > tag.json 2> tag-error.txt; then
            actual=$(node -p "JSON.parse(require('fs').readFileSync('tag.json')).object.sha")
            test "$actual" = "$GITHUB_SHA" || { echo '::error::Tag already points elsewhere'; exit 1; }
          elif ! grep -q 'HTTP 404' tag-error.txt; then
            cat tag-error.txt
            exit 1
          fi
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.bundle.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: 微巢 ${{ needs.bundle.outputs.tag }}
          body_path: release-assets/RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            release-assets/*.tgz
            release-assets/SHA256SUMS

  publish-npm:
    needs: [bundle, release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.17.0
      - uses: actions/download-artifact@v4
        with:
          name: desktop-bundle
          path: release-assets
      # Publish the same bytes attached to the Release, without rebuilding.
      - run: node scripts/publish-npm.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.DSH_WECHAT_NEST_NPM_TOKEN }}
